name: Build MineTogether

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and remap Fabric JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build with Fabric Loom
        run: gradle --no-daemon clean build

      - name: Verify remapped mod JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          jar_file=""
          while IFS= read -r candidate; do
            case "$candidate" in
              *-dev.jar|*-sources.jar) continue ;;
            esac
            jar_file="$candidate"
            break
          done < <(find build/libs -maxdepth 1 -type f -name '*.jar' | sort)
          if [ -z "$jar_file" ]; then
            echo "No remapped JAR found in build/libs"
            exit 1
          fi
          jar tf "$jar_file" > jar-contents.txt
          grep -Fxq 'fabric.mod.json' jar-contents.txt
          grep -Fxq 'com/minetogether/MineTogetherClient.class' jar-contents.txt
          grep -Fxq 'com/minetogether/screen/MineTogetherScreen.class' jar-contents.txt
          cp "$jar_file" release/MineTogether-0.3.0.jar
          echo "Verified: release/MineTogether-0.3.0.jar"
          ls -lh release/MineTogether-0.3.0.jar

      - name: Upload remapped JAR
        uses: actions/upload-artifact@v4
        with:
          name: MineTogether-0.3.0
          path: release/MineTogether-0.3.0.jar
          if-no-files-found: error
          retention-days: 30
