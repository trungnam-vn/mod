name: Build Auto Totem Plus

on:
  push:
    branches: [main]
    paths:
      - 'AutoTotemPlus/**'
      - '.github/workflows/build-autototemplus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Fabric JAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutoTotemPlus
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Build remapped Fabric JAR
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean build 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoTotemPlus-build-log
          path: AutoTotemPlus/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify JAR contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          jar_file="build/libs/AutoTotemPlus-1.0.0.jar"
          test -f "$jar_file"
          jar tf "$jar_file" > jar-contents.txt
          grep -Fxq 'fabric.mod.json' jar-contents.txt
          grep -Fxq 'com/hikari/autototemplus/AutoTotemPlusClient.class' jar-contents.txt
          grep -Fxq 'com/hikari/autototemplus/mixin/ClientPlayNetworkHandlerMixin.class' jar-contents.txt
          cp "$jar_file" release/AutoTotemPlus-1.0.0.jar
          ls -lh release/AutoTotemPlus-1.0.0.jar

      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoTotemPlus-1.0.0
          path: AutoTotemPlus/release/AutoTotemPlus-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
